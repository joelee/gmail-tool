name: Update Coverage Badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  update-badge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage-report
          path: coverage-artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh coverage badge JSON
        run: ./scripts/update-coverage-badge.sh coverage-artifacts/coverage.json .github/badges/coverage.json

      - name: Commit coverage badge update
        run: |
          if git diff --quiet -- .github/badges/coverage.json; then
            exit 0
          fi
          git add .github/badges/coverage.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update coverage badge"
          git push
